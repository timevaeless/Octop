# Octop 集群 LB（nginx）— docker/docker-compose.cluster.yml 挂载
#
# 要点：
# - SSE 必须 close 缓冲：proxy_buffering off + X-Accel-Buffering 透传，
#   否则浏览器 token 流会被 nginx 攒包，表现为「长时间无输出后一次性吐出」。
# - 回放依赖客户端带的 Last-Event-ID 头，nginx 默认透传请求头，无需配置。
# - upstream 用 resolve 参数（nginx >=1.27.3 开源版支持）+ docker
#   DNS(127.0.0.11) 运行时解析：api --scale 扩缩容后自动发现新副本，
#   无需重载 nginx（沿用旧变量方案的免重载能力）。
# - 同时获得被动健康检查（旧变量方案做不到）：max_fails/fail_timeout 把
#   失联副本摘出轮转，proxy_next_upstream 将连接失败/5xx 自动重试到健康
#   副本——挂一个 api 不再产生 1/N 的 502（集群计划 D9）。
# - api 侧 readiness 是 /api/health/ready（DB 连通 + 迁移版本匹配），
#   compose healthcheck / 外部编排用它区分「活着」与「能服务」。
#
# 注意：POST 等非幂等请求 nginx 默认只在「尚未发出」时才换副本重试
# （如连接被拒），已发出的请求不会重放——聊天消息不会因故障转移而重复。

resolver 127.0.0.11 valid=10s ipv6=off;

upstream octop_api {
    zone octop_api_zone 64k;
    server api:8088 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;

    location / {
        proxy_pass http://octop_api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上游 keepalive（配合 upstream keepalive 16）；SSE 长连接不受影响
        proxy_set_header Connection "";

        # 故障转移：连接失败/超时/5xx 自动换健康副本（未发出的请求）
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;

        # SSE：关缓冲 + 不限制响应时长
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
